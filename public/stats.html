<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="css/base.css"><style>.stats{width:620px;padding:18px}.head{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;font-weight:900}.r{display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px;border-top:1px solid #ffffff18;text-align:center}.r span:first-child{text-align:left;color:var(--muted)}</style><div class="overlay stats"><div class="head"><span></span><span id="an"></span><span id="hn"></span></div><div id="rows"></div></div><div id="error" class="error hidden"></div><script type="module">import{connect,text,el}from'./js/common.js';const labels={hits:'HITS',errors:'ERRORS',leftOnBase:'LEFT ON BASE',walks:'WALKS',strikeouts:'STRIKEOUTS'};connect(s=>{text('an',s.teams.away.short);text('hn',s.teams.home.short);const keys=[...new Set([...Object.keys(s.stats.away),...Object.keys(s.stats.home)])];el('rows').innerHTML=keys.map(k=>`<div class="r"><span>${labels[k]||k}</span><b>${s.stats.away[k]??'-'}</b><b>${s.stats.home[k]??'-'}</b></div>`).join('')})</script>
