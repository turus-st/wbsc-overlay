<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="css/base.css"><style>.wrap{width:900px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.title{font-size:24px;font-weight:900;margin-bottom:8px}.player{display:grid;grid-template-columns:45px 1fr 55px 65px;padding:7px 9px;background:#ffffff0b;border-bottom:1px solid #ffffff12}.hdr{color:var(--muted);font-size:12px}</style><div class="overlay wrap"><section><div id="awayTitle" class="title"></div><div class="player hdr"><span>#</span><span>PLAYER</span><span>POS</span><span>AVG</span></div><div id="away"></div></section><section><div id="homeTitle" class="title"></div><div class="player hdr"><span>#</span><span>PLAYER</span><span>POS</span><span>AVG</span></div><div id="home"></div></section></div><div id="error" class="error hidden"></div><script type="module">import{connect,text,el}from'./js/common.js';const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));connect(s=>{for(const side of ['away','home']){text(side+'Title',s.teams[side].name);el(side).innerHTML=s.lineups[side].map((p,i)=>`<div class="player"><b>${esc(p.number||i+1)}</b><span>${esc(p.name)}</span><span>${esc(p.position)}</span><span>${esc(p.avg)}</span></div>`).join('')}})</script>
