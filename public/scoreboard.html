<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="css/base.css"><style>.board{min-width:720px;display:grid;grid-template-columns:1fr 80px 160px}.row{display:contents}.row>*{padding:10px 14px;border-bottom:1px solid #ffffff18}.name{font-size:22px;font-weight:800}.mid{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:center;justify-content:center}.count{display:flex;gap:7px}.basebox{position:relative;width:55px;height:42px}.base{position:absolute;width:17px;height:17px;transform:rotate(45deg);background:#ffffff24;border:2px solid #fff}.b1{right:2px;top:18px}.b2{left:19px;top:1px}.b3{left:2px;top:18px}.base.on{background:#ffd54f}</style><div class="overlay board"><div class="row"><div class="team"><img id="al" class="logo"><span id="an" class="name"></span></div><div id="as" class="score"></div></div><div class="row"><div class="team"><img id="hl" class="logo"><span id="hn" class="name"></span></div><div id="hs" class="score"></div></div><div class="mid"><div><span id="half"></span> <b id="inn"></b></div><div class="basebox"><i id="b1" class="base b1"></i><i id="b2" class="base b2"></i><i id="b3" class="base b3"></i></div><div class="count"><span class="pill">B <b id="balls"></b></span><span class="pill">S <b id="strikes"></b></span><span class="pill">O <b id="outs"></b></span></div></div></div><div id="error" class="error hidden"></div><script type="module">import{connect,text,img,el}from'./js/common.js';connect(s=>{text('an',s.teams.away.short);text('hn',s.teams.home.short);text('as',s.score.away);text('hs',s.score.home);img('al',s.teams.away.logo);img('hl',s.teams.home.logo);text('half',s.situation.half==='TOP'?'▲':'▼');text('inn',s.situation.inning);['balls','strikes','outs'].forEach(k=>text(k,s.situation[k]));for(const k of ['first','second','third'])el('b'+({first:1,second:2,third:3}[k])).classList.toggle('on',s.situation.bases[k])})</script>
