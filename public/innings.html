<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="css/base.css"><style>.box{padding:12px 16px;min-width:760px}.grid{display:grid;gap:2px}.cell{padding:7px;text-align:center;background:#ffffff0b}.label{text-align:left;font-weight:800}.hdr{color:var(--muted)}</style><div class="overlay box"><div id="grid" class="grid"></div></div><div id="error" class="error hidden"></div><script type="module">import{connect,el}from'./js/common.js';const esc=s=>String(s??'');connect(s=>{const ins=s.score.innings;el('grid').style.gridTemplateColumns=`120px repeat(${ins.length},44px) 44px 44px 44px`;const row=(label,vals,total,h,e)=>`<div class="cell label">${label}</div>${vals.map(x=>`<div class="cell">${x}</div>`).join('')}<div class="cell"><b>${total}</b></div><div class="cell">${h}</div><div class="cell">${e}</div>`;el('grid').innerHTML=`<div class="cell"></div>${ins.map(x=>`<div class="cell hdr">${x.inning}</div>`).join('')}<div class="cell hdr">R</div><div class="cell hdr">H</div><div class="cell hdr">E</div>${row(esc(s.teams.away.short),ins.map(x=>x.away),s.score.away,s.score.hitsAway,s.score.errorsAway)}${row(esc(s.teams.home.short),ins.map(x=>x.home),s.score.home,s.score.hitsHome,s.score.errorsHome)}`})</script>
