<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="css/base.css"><style>.card{width:620px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.big{font-size:32px;font-weight:900}.bases{display:flex;gap:8px}.base{width:24px;height:24px;transform:rotate(45deg);background:#ffffff24;border:2px solid white}.base.on{background:var(--accent)}.play{grid-column:1/3;padding-top:10px;border-top:1px solid #ffffff20}</style><div class="overlay card"><div><div class="muted">INNING</div><div class="big"><span id="half"></span> <span id="inning"></span></div></div><div><div class="muted">COUNT</div><div class="big"><span id="balls"></span>-<span id="strikes"></span>, <span id="outs"></span> OUT</div></div><div><div class="muted">BATTER</div><b id="batter"></b><div id="batstat" class="muted"></div></div><div><div class="muted">PITCHER</div><b id="pitcher"></b></div><div class="bases"><i id="first" class="base"></i><i id="second" class="base"></i><i id="third" class="base"></i></div><div id="play" class="play"></div></div><div id="error" class="error hidden"></div><script type="module">import{connect,text,el}from'./js/common.js';connect(s=>{for(const k of ['inning','balls','strikes','outs'])text(k,s.situation[k]);text('half',s.situation.half==='TOP'?'TOP ▲':'BOT ▼');text('batter',s.situation.batter.name);text('batstat',`AVG ${s.situation.batter.avg}  OPS ${s.situation.batter.ops}`);text('pitcher',s.situation.pitcher.name);text('play',s.situation.lastPlay);for(const k of ['first','second','third'])el(k).classList.toggle('on',s.situation.bases[k])})</script>
