<!doctype html><meta charset="utf-8"><script src="../config.js"></script><link rel="stylesheet" href="../css/common.css"><style>body{padding:0}.field{position:relative;width:1200px;height:1000px;margin:auto;background:radial-gradient(ellipse at 50% 70%,#179a42 0 22%,transparent 22.2%),radial-gradient(ellipse at 50% 57%,var(--dirt) 0 31%,transparent 31.2%),radial-gradient(ellipse at 50% 50%,#0e7031 0 67%,transparent 67.2%);clip-path:polygon(50% 100%,0 55%,3% 22%,16% 6%,50% 0,84% 6%,97% 22%,100% 55%)}.mark{position:absolute;width:21px;height:21px;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%)}.safe{background:var(--safe)}.out{background:var(--out)}.legend{position:fixed;left:18px;top:18px;background:#fff;padding:10px;border-radius:8px}.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin:0 5px 0 12px}</style><div class="legend"><i class="safe"></i>arrivo salvo <i class="out"></i>out</div><div id="field" class="field"></div><div class="status"></div><script type="module">import{start,$,clean}from'../js/data.js';start(g=>{const plays=(g.playdata||[]).filter(x=>Number(x.r1)===9&&Number(x.hp)>0);$('field').innerHTML=plays.map(x=>{const n=clean(x.n).toLowerCase(),safe=/single|double|triple|home run|reaches/.test(n),left=Math.max(5,Math.min(95,50+Number(x.hd||0)*.75)),top=Math.max(8,Math.min(82,92-Number(x.hp||0)*.32));return`<i class="mark ${safe?'safe':'out'}" style="left:${left}%;top:${top}%" title="${n.replaceAll('"','')}"></i>`}).join('')})</script>
