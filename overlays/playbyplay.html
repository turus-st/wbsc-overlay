<!doctype html><meta charset="utf-8"><script src="../config.js"></script><link rel="stylesheet" href="../css/common.css"><style>.feed{width:1220px}.inning{background:var(--header);padding:14px 18px;font-size:24px}.play{display:grid;grid-template-columns:78px 1fr;gap:15px;padding:14px 18px;background:rgba(255,255,255,.9);border-bottom:1px solid #eee;font-size:20px}.play:nth-child(odd){background:rgba(242,242,242,.92)}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#ddd}.dots{display:flex;gap:10px;margin-top:8px}.dot{width:25px;height:25px;border-radius:50%;background:var(--safe)}.dot.strike{background:var(--out)}.change{grid-template-columns:78px 1fr;color:#333}</style><div id="feed" class="card feed"></div><div class="status"></div><script type="module">import{start,$,clean,esc}from'../js/data.js';function avatar(g,b){const p=g.boxscore?.[b];return p?.image||''}start(g=>{let last='',html='';for(const x of g.playdata||[]){const n=clean(x.n),m=n.match(/^\*\*\*(TOP|BOT)\s+(\d+)/);if(m){last=`${m[1]} ${m[2]}`;html+=`<div class="inning">${last}</div>`;continue}if(!n)continue;const change=/Change:|Substitution:|Pinch Hitter:|Temporary Runner/.test(n),img=avatar(g,x.b),dot=Number(x.r1)===4||Number(x.r1)===5||Number(x.r1)===6?'strike':'',dots=Number(x.r1)>=2&&Number(x.r1)<=6?`<div class="dots"><i class="dot ${dot}"></i></div>`:'';html+=`<div class="play ${change?'change':''}"><div>${img?`<img class="avatar" src="${esc(img)}">`:''}</div><div>${esc(n).replaceAll('\n','<br>')}${dots}</div></div>`}$('feed').innerHTML=html||'<div class="empty">Nessuna azione disponibile</div>'})</script>
