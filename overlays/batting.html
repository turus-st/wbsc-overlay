<!doctype html><meta charset="utf-8"><script src="../config.js"></script><link rel="stylesheet" href="../css/common.css"><style>.box{width:1180px;background:rgba(246,247,244,.88)}.toolbar{display:flex;gap:10px;padding:10px}.toolbar button{border:0;padding:9px 15px;border-radius:6px;background:#cbd5de}.toolbar button.on{background:#203b55;color:#fff}.table{display:grid;grid-template-columns:48px minmax(270px,2fr) repeat(8,1fr);align-items:center}.cell{padding:6px 8px;font-size:19px}.head{border-bottom:1px solid var(--line);color:#6e7377}.player b{display:block;font-size:20px}.player span{font-size:17px}.sub{padding-left:25px}.tot{border-top:1px solid var(--line);margin-top:4px}</style><div class="card box"><div class="toolbar"><button id="ba"></button><button id="bh"></button></div><div id="table"></div></div><div class="status"></div><script type="module">import{start,$,hitters,seasonAvg,esc}from'../js/data.js';let game,side='away';function draw(){if(!game)return;const team=side==='away'?game.eventaway:game.eventhome,rows=hitters(game,team),head=['','#','PLAYER','AB','R','H','RBI','BB','SO','AVG','OPS'];$('table').innerHTML=`<div class="table head">${head.slice(1).map((x,i)=>`<div class="cell ${i>1?'num':''}">${x}</div>`).join('')}</div>`+rows.map(([k,p])=>`<div class="table"><div class="cell">${Math.floor(Number(k)%1000/10)||''}</div><div class="cell player ${p.reentry?'sub':''}"><b>${esc(p.lastname||p.name)}</b><span>${esc(p.firstname)} ${esc(p.POS)}</span></div>${[p.AB,p.R,p.H,p.RBI,p.BB,p.SO,seasonAvg(p),(()=>{const s=p.SEASON||{},ab=+s.AB||0,h=+s.H||0,bb=+s.BB||0,d=+s.DOUBLE||0,t=+s.TRIPLE||0,hr=+s.HR||0,hbp=+s.HBP||0,sf=+s.SF||0,obp=(h+bb+hbp)/(ab+bb+hbp+sf||1),slg=(h-d-t-hr+2*d+3*t+4*hr)/(ab||1);return(ab?obp+slg:0).toFixed(3).replace(/^0/,'')})()].map(x=>`<div class="cell num">${x??0}</div>`).join('')}</div>`).join('');$('ba').classList.toggle('on',side==='away');$('bh').classList.toggle('on',side==='home')}$('ba').onclick=()=>{side='away';draw()};$('bh').onclick=()=>{side='home';draw()};start(g=>{game=g;$('ba').textContent=g.eventaway;$('bh').textContent=g.eventhome;draw()})</script>
