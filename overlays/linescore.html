<!doctype html><meta charset="utf-8"><script src="../config.js"></script><link rel="stylesheet" href="../css/common.css"><style>.board{min-width:1180px;padding:0 8px}.grid{display:grid;align-items:center;border-bottom:1px solid var(--line)}.c{padding:13px 8px;font-size:21px}.head{color:#8a8f94;text-align:center}.team{display:flex;gap:14px;align-items:center;font-weight:800;font-size:22px}.flag{width:33px;height:24px;border-radius:5px;background:#d9dde1;display:grid;place-items:center;font-size:10px}.record{display:block;font-weight:400;color:#a2a6aa}.strong{font-weight:800;text-align:center}</style><div class="card board"><div id="grid"></div></div><div class="status"></div><script type="module">import{start,$}from'../js/data.js';start(g=>{const l=g.linescore||{},a=(l.awayruns||[]).slice(1),h=(l.homeruns||[]).slice(1),n=Math.max(a.length,h.length,Number(g.innings)||0,1),cols=`220px repeat(${n},1fr) repeat(3,70px)`,hdr=['',...Array.from({length:n},(_,i)=>i+1),'R','H','E'];const row=(team,v,t)=>`<div class="grid" style="grid-template-columns:${cols}"><div class="c team"><span class="flag">${team}</span><span>${team}</span></div>${Array.from({length:n},(_,i)=>`<div class="c strong">${v[i]??''}</div>`).join('')}<div class="c strong">${t?.R??0}</div><div class="c strong">${t?.H??0}</div><div class="c strong">${t?.E??0}</div></div>`;$('grid').innerHTML=`<div class="grid" style="grid-template-columns:${cols}">${hdr.map(x=>`<div class="c head">${x}</div>`).join('')}</div>${row(g.eventaway,a,l.awaytotals)}${row(g.eventhome,h,l.hometotals)}`})</script>
