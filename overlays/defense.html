<!doctype html><meta charset="utf-8"><script src="../config.js"></script><link rel="stylesheet" href="../css/common.css"><style>body{padding:0}.field{position:relative;width:1240px;height:1030px;margin:auto;background:radial-gradient(ellipse at 50% 70%,#179a42 0 22%,transparent 22.2%),radial-gradient(ellipse at 50% 57%,var(--dirt) 0 31%,transparent 31.2%),radial-gradient(ellipse at 50% 50%,#0e7031 0 67%,transparent 67.2%);clip-path:polygon(50% 100%,0 55%,3% 22%,16% 6%,50% 0,84% 6%,97% 22%,100% 55%);border:10px solid var(--dirt)}.base{position:absolute;width:22px;height:22px;background:#fff;transform:rotate(45deg)}.b1{left:64%;top:65%}.b2{left:49%;top:47%}.b3{left:34%;top:65%}.player{position:absolute;transform:translate(-50%,-50%);width:145px;text-align:center;color:#fff;text-shadow:0 2px 4px #000;font-weight:800}.player img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #fff;background:#333}.player b,.player span{display:block}.toolbar{position:fixed;left:15px;top:15px;z-index:5}.toolbar button{padding:8px 14px}</style><div class="toolbar"><button id="swap">Cambia difesa</button></div><div id="field" class="field"><i class="base b1"></i><i class="base b2"></i><i class="base b3"></i></div><div class="status"></div><script type="module">import{start,$,currentDefense,esc}from'../js/data.js';const pos={P:[50,68],C:[50,88],'1B':[67,64],'2B':[59,49],'3B':[33,64],SS:[41,49],LF:[25,31],CF:[50,18],RF:[75,31]};let game,side='away';function draw(){if(!game)return;const team=side==='away'?game.eventaway:game.eventhome,m=currentDefense(game,team);$('field').querySelectorAll('.player').forEach(x=>x.remove());for(const [p,xy]of Object.entries(pos)){const x=m.get(p);if(!x)continue;const d=document.createElement('div');d.className='player';d.style.left=xy[0]+'%';d.style.top=xy[1]+'%';d.innerHTML=`<img src="${esc(x.image)}"><b>${esc(x.lastname||x.name)}</b><span>${esc(x.firstname||'')}</span>`;$('field').appendChild(d)}}$('swap').onclick=()=>{side=side==='away'?'home':'away';draw()};start(g=>{game=g;draw()})</script>
