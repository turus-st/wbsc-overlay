<!doctype html><meta charset="utf-8"><script src="../config.js"></script><link rel="stylesheet" href="../css/common.css"><style>body{padding:10px}.bug{width:820px;background:#07090d;color:#fff;border:3px solid #262a31;box-shadow:0 10px 30px #000a}.title{height:38px;padding:4px 14px;font-size:24px;font-weight:800;letter-spacing:.4px;border-bottom:2px solid #4a4d53;white-space:nowrap;overflow:hidden}.main{display:grid;grid-template-columns:350px 90px 100px 1fr;height:142px}.teams{display:grid;grid-template-rows:1fr 1fr}.team{display:grid;grid-template-columns:1fr 70px;align-items:center;background:#145b8c;border-bottom:2px solid #20313f}.team b{font-size:37px;padding-left:18px}.team span{font-size:48px;text-align:center;background:#e8e8e8;color:#050505;height:100%;display:grid;place-items:center}.inning{display:grid;place-items:center;font-size:30px;border-right:2px solid #333}.count{display:grid;place-items:center;font-size:34px;border-right:2px solid #333}.right{display:grid;grid-template-rows:1fr 1fr;padding:10px}.bases{position:relative;width:94px;height:57px;margin:auto}.diamond{position:absolute;width:30px;height:30px;transform:rotate(45deg);background:#391113;border:2px solid #951d23}.diamond.on{background:#df252a}.d1{right:1px;bottom:1px}.d2{left:32px;top:0}.d3{left:1px;bottom:1px}.outs{display:flex;justify-content:center;gap:12px}.out{width:22px;height:22px;border-radius:50%;background:#361010;border:2px solid #951d23}.out.on{background:#df252a}.footer{display:grid;grid-template-columns:1fr 145px;border-top:2px solid #4a4d53;font-size:24px}.footer div{padding:7px 14px}.footer div:last-child{text-align:right}</style><div class="bug"><div id="title" class="title">WBSC GAME DATA</div><div class="main"><div class="teams"><div class="team"><b id="away"></b><span id="as"></span></div><div class="team"><b id="home"></b><span id="hs"></span></div></div><div id="inn" class="inning"></div><div id="count" class="count"></div><div class="right"><div class="bases"><i id="r1" class="diamond d1"></i><i id="r2" class="diamond d2"></i><i id="r3" class="diamond d3"></i></div><div class="outs"><i id="o1" class="out"></i><i id="o2" class="out"></i></div></div></div><div class="footer"><div><b id="batter"></b><br><span id="pitcher" class="muted"></span></div><div id="pitchcount"></div></div></div><div class="status"></div><script type="module">import{start,$,pitchers}from'../js/data.js';start(g=>{const s=g.situation||{},l=g.linescore||{};$('away').textContent=g.eventaway||'AWAY';$('home').textContent=g.eventhome||'HOME';$('as').textContent=l.awaytotals?.R??0;$('hs').textContent=l.hometotals?.R??0;$('inn').textContent=s.currentinning||'';$('count').textContent=`${s.balls??0}-${s.strikes??0}`;[1,2,3].forEach(n=>$('r'+n).classList.toggle('on',!!s['runner'+n]));[1,2].forEach(n=>$('o'+n).classList.toggle('on',Number(s.outs)>=n));$('batter').textContent=s.batter||'';$('pitcher').textContent=s.pitcher||'';const ps=pitchers(g,s.uniform?.includes('home')?g.eventhome:g.eventaway),p=ps.find(([,x])=>x.playerid===s.pitcherid)?.[1];$('pitchcount').textContent=p?`P: ${p.PITCHES}`:''})</script>
