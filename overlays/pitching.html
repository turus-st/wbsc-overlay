<!doctype html><meta charset="utf-8"><script src="../config.js"></script><link rel="stylesheet" href="../css/common.css"><style>.box{width:1180px;background:rgba(246,247,244,.9)}.toolbar{padding:10px;display:flex;gap:10px}.toolbar button{border:0;padding:9px 15px;border-radius:6px;background:#cbd5de}.toolbar button.on{background:#203b55;color:#fff}.row{display:grid;grid-template-columns:48px minmax(260px,2fr) repeat(7,1fr);align-items:center}.cell{padding:8px;font-size:19px}.head{border-bottom:1px solid var(--line);color:#686d71}.player b{display:block}.tot{border-top:1px solid var(--line)}</style><div class="card box"><div class="toolbar"><button id="pa"></button><button id="ph"></button></div><div id="rows"></div></div><div class="status"></div><script type="module">import{start,$,pitchers,esc}from'../js/data.js';let game,side='away';function draw(){if(!game)return;const team=side==='away'?game.eventaway:game.eventhome,ps=pitchers(game,team);$('rows').innerHTML=`<div class="row head"><div></div><div class="cell">PITCHER</div>${['IP','H','R','ER','BB','SO','ERA'].map(x=>`<div class="cell num">${x}</div>`).join('')}</div>`+ps.map(([k,p],i)=>`<div class="row"><div class="cell">${i+1}</div><div class="cell player"><b>${esc(p.lastname||p.name)}</b><span>${esc(p.firstname)}</span></div>${[p.PITCHIP,p.PITCHH,p.PITCHR,Math.max(0,Number(p.PITCHR||0)-Number(p.E||0)),p.PITCHBB,p.PITCHSO,p.ERA].map(x=>`<div class="cell num">${x??0}</div>`).join('')}</div>`).join('')}$('pa').onclick=()=>{side='away';draw()};$('ph').onclick=()=>{side='home';draw()};start(g=>{game=g;$('pa').textContent=g.eventaway;$('ph').textContent=g.eventhome;$('pa').classList.toggle('on',side==='away');$('ph').classList.toggle('on',side==='home');draw()})</script>
